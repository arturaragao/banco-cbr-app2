<style>

 --okbg:#e3f5ec;--badbg:#fbe7ea;--pbg:#fff6dc;--ptx:#4a3b00;--f:#12874f;--m:#b4690e;--d:#c9304a;color-scheme:light}}
:root[data-theme="light"]{
 --bg:#f2f5fc;--band:#1f4fd6;--card:#fff;--card2:#eaf0fd;--tx:#0e1830;--mut:#5a6889;--bd:#d9e1f3;
 --pri:#2358e6;--pri-tx:#2358e6;--on-pri:#fff;--ok:#12874f;--bad:#c9304a;--warn:#b4690e;
 --okbg:#e3f5ec;--badbg:#fbe7ea;--pbg:#fff6dc;--ptx:#4a3b00;--f:#12874f;--m:#b4690e;--d:#c9304a;color-scheme:light}
:root[data-theme="dark"]{
 --bg:#0a1020;--band:#0f1a38;--card:#121b33;--card2:#182446;--tx:#e9eefc;--mut:#8e9bbd;--bd:#223056;
 --pri:#2f6bff;--pri-tx:#7fa3ff;--on-pri:#fff;--ok:#2fc57a;--bad:#f2677a;--warn:#f0b04a;

*{box-sizing:border-box}

.tg{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:99px;padding:6px 12px;font:600 .78rem var(--fb);cursor:pointer}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;display:none;max-width:90vw}
textarea{width:100%;min-height:90px;font:12px monospace;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px;min-width:0}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.md{white-space:normal}.md p{margin:0 0 6px}.md p:last-child{margin-bottom:0}.md ul,.md ol{margin:2px 0 8px;padding-left:20px}.md li{margin:2px 0}
.md p+p:has(>b:first-child){margin-top:10px}
.mdt{overflow-x:auto;margin:4px 0 10px}.mdt table{border-collapse:collapse;font-size:.88rem;line-height:1.45;min-width:60%}.mdt th,.mdt td{border:1px solid color-mix(in srgb,var(--mut) 35%,transparent);padding:5px 8px;text-align:left;vertical-align:top}.mdt th{background:color-mix(in srgb,var(--pri) 12%,transparent)}
.cm{white-space:normal}.cm p{margin:0}.cm .ok{color:#16a34a;font-weight:700}.cm .no{color:#dc2626;font-weight:700}
.tw{overflow-x:auto}

th{color:var(--mut);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}tr.cl{cursor:pointer}tr.cl:hover{background:var(--card2)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;min-width:60px;position:relative}.bar i{display:block;height:100%;background:var(--pri)}
.bar.g i{background:var(--ok)}.bar.r i{background:var(--bad)}.bar.w i{background:var(--warn)}
.bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--tx);opacity:.8}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--card2);border-radius:12px;padding:12px 14px}.kpi b{font:700 1.6rem var(--fd);display:block;font-variant-numeric:tabular-nums}
#zoom{position:fixed;inset:0;background:rgba(4,8,18,.95);z-index:40;display:flex;flex-direction:column}

#zbar button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:8px;padding:6px 12px;font:600 .9rem var(--fb);cursor:pointer;min-width:38px}
#zst{flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
#zst:active{cursor:grabbing}
[hidden]{display:none!important}
#zimg{max-width:96vw;max-height:calc(100vh - 70px);object-fit:contain;user-select:none;-webkit-user-select:none;will-change:transform}
.tagstop{margin:10px 0 2px}.tagstop .tag{font-size:.8rem;padding:2px 11px;border-color:color-mix(in srgb,var(--pri) 45%,var(--bd));color:var(--tx)}
code{background:var(--card2);border-radius:5px;padding:1px 6px;font-size:.85em}
.ccq{background:color-mix(in srgb,var(--pri) 20%,var(--card2));color:var(--tx);border:1px solid color-mix(in srgb,var(--pri) 45%,var(--bd));border-radius:14px;padding:16px 20px;width:100%}
.ccqh{display:flex;align-items:center;gap:8px;font:700 .72rem var(--fb);letter-spacing:.1em;text-transform:uppercase;color:var(--pri-tx);margin-bottom:6px}
.ccqt{font:700 1.2rem/1.4 var(--fd)}
.qtitle{font:700 .95rem var(--fd);color:var(--tx)}
.dimg{margin-top:8px}.dimg .kick{margin-bottom:3px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{background:var(--card);color:var(--mut);border:1px solid var(--bd);border-radius:99px;padding:7px 14px;font:600 .85rem var(--fb);cursor:pointer}
.subtabs button.on{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
.ia{margin-top:12px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.iab{background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:14px 18px;width:100%}
.md h2{font-size:1.15rem;margin:1.3em 0 .4em}.md h3{font-size:1rem;margin:1.1em 0 .3em}.md h4{font-size:.95rem}
.md p{margin:.45em 0;line-height:1.65}.md ul{margin:.4em 0;padding-left:1.2em}.md li{margin:.25em 0;line-height:1.55}
.iab p{margin:.35em 0}.iab ul{margin:.2em 0}
.fcbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.fcn{display:flex;gap:14px;font:700 .9rem var(--fb);font-variant-numeric:tabular-nums}
.fcard{min-height:240px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.fcf{font-size:1.25rem;white-space:normal;line-height:1.5}.fcf ul,.fcf ol,.rte ul,.rte ol{margin:4px 0;padding-left:22px}
.rte{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;overflow:auto;resize:vertical;max-height:75vh;line-height:1.5;outline:none;font:inherit;white-space:normal;cursor:text}.rte:focus{border-color:var(--pri)}.rte:empty:before{content:attr(data-ph);color:var(--mut)}
.rtbar{display:flex;gap:4px;margin:4px 0 4px}.rtbar button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;min-width:30px;height:28px;cursor:pointer;font:inherit;font-size:.85rem}.rtbar button:hover{background:var(--card2)}
.fcard hr{width:100%;border:0;border-top:1px solid var(--bd);margin:18px 0}
.cz{background:var(--card2);border-radius:6px;padding:0 6px;color:var(--pri-tx);font-weight:700}.cz.on{background:var(--pri);color:var(--on-pri)}
.fcg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.fcg button{border:0;border-radius:12px;padding:12px 6px;color:#fff;font:700 .95rem var(--fb);cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center}

.fcg .g1{background:#c9304a}.fcg .g2{background:#b4690e}.fcg .g3{background:#12874f}.fcg .g4{background:#2358e6}
kbd{background:rgba(255,255,255,.2);border-radius:5px;padding:0 6px;font:600 .72rem var(--fb);margin-left:4px}
@media(max-width:520px){.fcg{grid-template-columns:repeat(2,1fr)}}
.qlay{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.qnav{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;order:2}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:12px}
.qn{position:relative;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;height:36px;cursor:pointer;font:700 .85rem var(--fb);padding:0}

.timer{position:sticky;top:96px;float:right;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:4px 10px;font-variant-numeric:tabular-nums;z-index:3}
/* agenda */
.ag{width:100%;border-collapse:separate;border-spacing:0}

.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}

.kick{font:700 .72rem var(--fb);text-transform:uppercase;letter-spacing:.08em;color:var(--pri-tx)}

.sk{border-left:3px solid var(--pri);padding-left:12px;margin:10px 0}

@media(max-width:520px){#sync span{display:none}.brand{font-size:1.05rem}.tg{padding:6px 10px}.dot{width:24px;height:24px}.ag td{padding:10px 1px}.ag td.lb{min-width:70px;font-size:.8rem;padding-right:2px}.ag td.lb span{font-size:.7rem}.card{padding:14px}.dot{width:22px;height:22px}}

.card.feito{border-color:var(--ok)}
.qpos{font-size:.68rem;color:var(--mut);opacity:.8;white-space:nowrap}
.rsm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
